[build]
  command = "npm run build"
  publish = "dist"

# Shared self-only security headers are copied from public/_headers.

[[redirects]]
  from = "/ide"
  to = "/"
  status = 301

[[redirects]]
  from = "/ide/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/"
  status = 301

[[redirects]]
  from = "/signin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/register"
  to = "/"
  status = 301

[[redirects]]
  from = "/register/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/forgot-password"
  to = "/"
  status = 301

[[redirects]]
  from = "/forgot-password/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/reset-password"
  to = "/"
  status = 301

[[redirects]]
  from = "/reset-password/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/auth"
  to = "/"
  status = 301

[[redirects]]
  from = "/auth/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/avr/tools/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/avr/curated/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
